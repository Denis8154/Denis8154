<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Achievement-Board</title>
<style>
  :root{
    --bg:#1b1b1f; --panel:#2a2a30; --panel2:#33333b; --text:#f2f2f2; --muted:#a0a0ab;
    --done:#55ff55; --gold:#ffcc33; --line:#0c0c0e; --accent:#5fb35f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",system-ui,sans-serif;
    background-image:linear-gradient(45deg,#202025 25%,transparent 25%,transparent 75%,#202025 75%),
                     linear-gradient(45deg,#202025 25%,transparent 25%,transparent 75%,#202025 75%);
    background-size:40px 40px;background-position:0 0,20px 20px}
  header{padding:20px 16px 8px;text-align:center}
  h1{margin:0;font-size:clamp(1.6rem,5vw,2.6rem);letter-spacing:1px;text-shadow:3px 3px 0 #000}
  .sub{color:var(--muted);margin-top:4px}
  .total{max-width:760px;margin:16px auto 0;padding:0 16px}
  .bar{height:22px;background:#000;border:3px solid #000;outline:2px solid #555;position:relative}
  .bar>i{display:block;height:100%;background:linear-gradient(#7dff7d,#3fae3f);width:0;transition:width .4s}
  .bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:bold;text-shadow:1px 1px 0 #000}
  .tools{max-width:1100px;margin:16px auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tools input[type=search]{flex:1 1 220px;padding:10px;background:#111;border:2px solid #555;color:var(--text);font-size:1rem}
  button,select{background:var(--panel2);color:var(--text);border:2px solid #555;padding:9px 12px;font-size:.9rem;cursor:pointer}
  button:hover{border-color:var(--gold)}
  nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:6px}
  nav button{display:flex;gap:6px;align-items:center}
  nav button.active{background:var(--accent);border-color:#fff;color:#000;font-weight:bold}
  nav small{opacity:.8}
  main{max-width:1100px;margin:16px auto 60px;padding:0 16px}
  .cat{margin-bottom:28px}
  .cat h2{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    border-bottom:3px solid #000;padding-bottom:6px;text-shadow:2px 2px 0 #000}
  .cat h2 small{font-size:.8rem;color:var(--muted);font-weight:normal;text-shadow:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .ach{display:flex;gap:10px;align-items:center;padding:10px;background:var(--panel);border:3px solid #000;
    outline:2px solid #444;cursor:pointer;user-select:none;text-align:left;color:var(--text);width:100%}
  .ach:hover{outline-color:var(--gold)}
  .icon{flex:0 0 46px;height:46px;display:grid;place-items:center;font-size:1.6rem;background:#111;border:3px solid #000;
    outline:2px solid #555;filter:grayscale(1) brightness(.55);transition:.2s}
  .ach .t{font-weight:bold;line-height:1.2}
  .ach .d{font-size:.78rem;color:var(--muted);margin-top:2px}
  .ach.done{background:#2b3a2b}
  .ach.done .icon{filter:none;outline-color:var(--gold);background:#3b3a1a}
  .ach.done .t{color:var(--done)}
  .toast{position:fixed;right:16px;top:16px;background:#222;border:3px solid #000;outline:2px solid var(--gold);
    padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:9;transform:translateX(130%);transition:.35s;max-width:calc(100vw - 32px)}
  .toast.show{transform:none}
  .toast b{color:var(--gold);display:block;font-size:.8rem}
  .empty{color:var(--muted);text-align:center;padding:40px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding-bottom:30px}
</style>
</head>
<body>
<header>
  <h1>🏆 Mein Achievement-Board</h1>
  <div class="sub">Alles, was diese Welt zu bieten hat – hak ab, was du erlebt hast.</div>
</header>

<div class="total"><div class="bar"><i id="totalFill"></i><span id="totalText"></span></div></div>

<div class="tools">
  <input type="search" id="q" placeholder="Suchen … (z. B. Sushi, Japan, Marathon)">
  <select id="filter">
    <option value="all">Alle</option>
    <option value="open">Nur offene</option>
    <option value="done">Nur erledigte</option>
  </select>
  <button id="exportBtn">⬇ Export</button>
  <button id="importBtn">⬆ Import</button>
  <button id="resetBtn">🗑 Zurücksetzen</button>
  <input type="file" id="file" accept="application/json" hidden>
</div>

<nav id="nav"></nav>
<main id="main"></main>
<footer>Fortschritt wird automatisch in deinem Browser gespeichert. Mit „Export“ sicherst du ihn als Datei.</footer>
<div class="toast" id="toast"><div class="icon" id="toastIcon" style="filter:none"></div><div><b>Erfolg freigeschaltet!</b><span id="toastText"></span></div></div>

// ---------- Logik ----------
const KEY = "achievement-board-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

const items = [];
DATA.forEach(c => c.items.forEach((raw, i) => {
  const [title, desc] = raw.split("|");
  items.push({ key: c.id + ":" + title, cat: c.id, title, desc: desc || "" });
}));

let activeCat = "all";
const $ = s => document.querySelector(s);

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const f = $("#filter").value;
  const main = $("#main"); main.innerHTML = "";
  let shown = 0;

  DATA.forEach(c => {
    if (activeCat !== "all" && activeCat !== c.id) return;
    const list = items.filter(it => it.cat === c.id).filter(it => {
      const done = !!state[it.key];
      if (f === "open" && done) return false;
      if (f === "done" && !done) return false;
      return !q || (it.title + " " + it.desc).toLowerCase().includes(q);
    });
    if (!list.length) return;
    shown += list.length;
    const total = items.filter(it => it.cat === c.id);
    const done = total.filter(it => state[it.key]).length;

    const sec = document.createElement("section"); sec.className = "cat";
    sec.innerHTML = `<h2><span>${c.icon} ${c.name}</span><small>${done} / ${total.length} (${Math.round(done/total.length*100)}%)</small></h2>`;
    const grid = document.createElement("div"); grid.className = "grid";
    list.forEach(it => {
      const b = document.createElement("button");
      b.className = "ach" + (state[it.key] ? " done" : "");
      b.innerHTML = `<div class="icon">${c.icon}</div><div><div class="t"></div><div class="d"></div></div>`;
      b.querySelector(".t").textContent = it.title;
      b.querySelector(".d").textContent = it.desc;
      b.onclick = () => toggle(it, c);
      grid.appendChild(b);
    });
    sec.appendChild(grid); main.appendChild(sec);
  });
  if (!shown) main.innerHTML = '<div class="empty">Nichts gefunden.</div>';
  renderNav(); renderTotal();
}

function renderNav() {
  const nav = $("#nav"); nav.innerHTML = "";
  const mk = (id, label, extra) => {
    const b = document.createElement("button");
    b.className = activeCat === id ? "active" : "";
    b.innerHTML = `${label} <small>${extra}</small>`;
    b.onclick = () => { activeCat = id; render(); };
    nav.appendChild(b);
  };
  mk("all", "🏆 Alle", `${items.filter(i=>state[i.key]).length}/${items.length}`);
  DATA.forEach(c => {
    const t = items.filter(i => i.cat === c.id);
    mk(c.id, `${c.icon} ${c.name}`, `${t.filter(i=>state[i.key]).length}/${t.length}`);
  });
}

function renderTotal() {
  const d = items.filter(i => state[i.key]).length;
  const p = d / items.length * 100;
  $("#totalFill").style.width = p + "%";
  $("#totalText").textContent = `${d} / ${items.length} Erfolge (${p.toFixed(1)} %)`;
}

let toastTimer;
function toggle(it, c) {
  if (state[it.key]) delete state[it.key]; else {
    state[it.key] = Date.now();
    $("#toastIcon").textContent = c.icon;
    $("#toastText").textContent = it.title;
    $("#toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 2500);
  }
  save(); render();
}

$("#q").oninput = render;
$("#filter").onchange = render;
$("#exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type:"application/json"}));
  a.download = "achievements.json"; a.click();
};
$("#importBtn").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const r = new FileReader();
  r.onload = () => { try { state = JSON.parse(r.result); save(); render(); } catch(err) { alert("Datei ungültig."); } };
  if (e.target.files[0]) r.readAsText(e.target.files[0]);
};
$("#resetBtn").onclick = () => { if (confirm("Wirklich alle Erfolge zurücksetzen?")) { state = {}; save(); render(); } };

render();
</script>
</body>
</html>
